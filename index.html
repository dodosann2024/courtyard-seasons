<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,">
<title>四季小院</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#cfd6dc;font-family:"Songti SC","Noto Serif SC","STSong",serif;color:#2d2a26}
canvas{display:block}
.t{position:fixed;left:clamp(16px,3.5vw,40px);top:clamp(14px,3vw,34px);pointer-events:none}
.t h1{margin:0;font-weight:400;font-size:clamp(22px,3vw,34px);letter-spacing:.45em;color:#fff;text-shadow:0 1px 18px rgba(0,0,0,.35)}
.t div{margin-top:6px;font-size:12px;letter-spacing:.4em;color:rgba(255,255,255,.8);text-shadow:0 1px 8px rgba(0,0,0,.4)}
.p{position:fixed;left:50%;bottom:clamp(12px,2.5vw,26px);transform:translateX(-50%);display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:center;
 padding:12px 20px;border-radius:18px;background:rgba(28,30,36,.38);backdrop-filter:blur(14px) saturate(1.3);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.35);box-shadow:0 8px 30px rgba(0,0,0,.18);max-width:94vw}
.g{display:flex;gap:6px;align-items:center}
.g span{font-size:11px;letter-spacing:.2em;color:rgba(255,255,255,.85);margin-right:4px;text-shadow:0 1px 4px rgba(0,0,0,.4)}
button{white-space:nowrap;font:inherit;font-size:15px;min-width:38px;padding:6px 10px;border-radius:10px;border:1px solid rgba(255,255,255,.4);background:rgba(255,255,255,.18);color:#fff;cursor:pointer;transition:.25s;text-shadow:0 1px 4px rgba(0,0,0,.35)}
button:hover{background:rgba(255,255,255,.32)}
button.on{background:rgba(255,255,255,.85);color:#3b3329;text-shadow:none}
input[type=range]{width:110px;accent-color:#f3e7d3}
.sub{flex-basis:100%;justify-content:center;min-height:30px}.sub:empty{display:none}.sub button{font-size:13px;padding:4px 10px;border-radius:14px;background:rgba(255,255,255,.1)}.sub button.on{background:rgba(255,255,255,.75)}.sub span{opacity:.8}
@media (max-width:520px){.p{padding:10px 12px;gap:8px 12px}button{font-size:14px;padding:5px 8px;min-width:34px}.sub button{font-size:12px;padding:4px 8px}}
.p{transition:transform .45s cubic-bezier(.5,0,.2,1),opacity .35s;transform-origin:50% 100%}
#fold{position:absolute;top:-14px;right:-10px;min-width:0;width:30px;height:30px;padding:0;border-radius:50%;font-size:15px;background:rgba(28,30,36,.55);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
#fab{position:fixed;left:50%;bottom:clamp(14px,3vw,28px);width:44px;height:44px;min-width:0;padding:0;border-radius:50%;font-size:19px;transform:translateX(-50%) scale(.2);opacity:0;pointer-events:none;
 background:rgba(28,30,36,.38);backdrop-filter:blur(14px) saturate(1.3);-webkit-backdrop-filter:blur(14px);box-shadow:0 6px 20px rgba(0,0,0,.2);transition:transform .4s .15s cubic-bezier(.3,1.4,.5,1),opacity .3s .15s}
body.col .p{transform:translateX(-50%) translateY(10px) scale(.06);opacity:0;pointer-events:none}
body.col #fab{transform:translateX(-50%) scale(1);opacity:1;pointer-events:auto}
#info{font-size:12px;letter-spacing:.12em;opacity:.85}
.sep{width:1px;height:26px;background:rgba(255,255,255,.35)}
</style></head><body>
<div class="t"><h1>四季小院</h1><div>FOUR SEASONS · COURTYARD</div></div>
<div class="p">
 <div class="g" id="gs"><span>季</span><button data-s="0">春</button><button data-s="1">夏</button><button data-s="2">秋</button><button data-s="3">冬</button></div><div class="sep"></div>

 <div class="g sub" id="sub"></div><div class="sep"></div>
 <div class="g" id="gy"><span>院</span><button data-y="def">默认小院</button><button data-y="jp">日式庭院</button></div><div class="sep"></div>
 <div class="g"><span>风</span><input id="wind" type="range" min="0" max="1" step="0.01" value="0.35"></div><div class="sep"></div>
 <div class="g"><button id="night">夜</button><button id="auto">四季轮转</button><button id="orbit">自动环绕</button><button id="meteor">流星雨</button><button id="lines">星座</button><button id="reset" title="复位视角">⟲</button></div>

 <div class="g sub"><span id="info"></span></div>
 <button id="fold" title="收起">⌄</button>
</div>
